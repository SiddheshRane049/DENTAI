{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DentAI — Patient History</title>
  <link rel="icon" type="image/png" href="{% static 'logo.png' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <style>
    :root {
      --teal:#0d7377; --teal-dark:#0a5a5e; --teal-light:#e6f4f5; --teal-mid:#b2dfe0;
      --coral:#ff6b6b; --coral-light:#fff0f0;
      --bg:#f8fafb; --surface:#ffffff; --border:#e8ecef;
      --text-primary:#1a2332; --text-secondary:#5a6a7a; --text-muted:#9aabb8;
      --red:#e53e3e; --orange:#dd6b20; --green:#276749;
      --shadow-sm:0 1px 4px rgba(13,115,119,0.06); --shadow-md:0 4px 20px rgba(13,115,119,0.10);
      --radius-sm:8px; --radius-md:14px; --sidebar-w:260px; --transition:0.22s cubic-bezier(0.4,0,0.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}
    .sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;box-shadow:var(--shadow-sm);}
    .sidebar-logo{padding:28px 24px 22px;border-bottom:1px solid var(--border);}
    .logo-mark{display:flex;align-items:center;gap:10px;}
    .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(13,115,119,0.25);}
    .logo-text h1{font-family:'Lora',serif;font-size:19px;font-weight:700;color:var(--teal-dark);letter-spacing:-0.3px;}
    .logo-text p{font-size:10.5px;color:var(--text-muted);margin-top:1px;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;}
    .sidebar-nav{flex:1;padding:20px 12px;overflow-y:auto;}
    .nav-section-label{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;padding:0 12px;margin:16px 0 6px;}
    .nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:var(--radius-sm);transition:all var(--transition);font-size:14px;font-weight:500;text-decoration:none;color:var(--text-secondary);margin-bottom:2px;position:relative;}
    .nav-item:hover{background:var(--teal-light);color:var(--teal);}
    .nav-item.active{background:var(--teal-light);color:var(--teal);font-weight:600;}
    .nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--teal);border-radius:0 3px 3px 0;}
    .nav-item .material-icons-round{font-size:19px;}
    .sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);}
    .doctor-card{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);}
    .doctor-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:white;flex-shrink:0;}
    .doctor-name{font-size:13px;font-weight:600;color:var(--text-primary);}
    .doctor-role{font-size:11px;color:var(--text-muted);margin-top:1px;}
    /* Main */
    .main{margin-left:var(--sidebar-w);flex:1;padding:36px 40px;}
    .page-header{margin-bottom:28px;display:flex;align-items:flex-end;justify-content:space-between;}
    .page-header h2{font-family:'Lora',serif;font-size:28px;font-weight:700;color:var(--text-primary);letter-spacing:-0.5px;}
    .page-header p{color:var(--text-secondary);margin-top:5px;font-size:14px;}
    /* Search / Filter bar */
    .filter-bar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
    .search-wrap{position:relative;flex:1;min-width:200px;}
    .search-wrap .material-icons-round{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:19px;}
    .search-wrap input{width:100%;padding:10px 14px 10px 40px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;background:var(--surface);font-family:'Inter',sans-serif;outline:none;color:var(--text-primary);transition:border-color var(--transition),box-shadow var(--transition);}
    .search-wrap input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,115,119,0.12);}
    .filter-select{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;background:var(--surface);font-family:'Inter',sans-serif;outline:none;color:var(--text-primary);cursor:pointer;transition:border-color var(--transition);}
    .filter-select:focus{border-color:var(--teal);}
    /* Table */
    .table-card{background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;animation:fadeUp 0.4s ease both;}
    table{width:100%;border-collapse:collapse;}
    thead th{background:var(--bg);color:var(--text-muted);padding:12px 18px;font-size:11px;font-weight:700;text-align:left;letter-spacing:0.7px;text-transform:uppercase;border-bottom:1px solid var(--border);}
    tbody tr{border-bottom:1px solid var(--border);transition:background var(--transition);}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:var(--teal-light);}
    tbody td{padding:14px 18px;font-size:13.5px;}
    .patient-cell{display:flex;align-items:center;gap:10px;}
    .patient-initials{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal-light),var(--teal-mid));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--teal-dark);flex-shrink:0;}
    .patient-full-name{font-weight:600;font-size:13.5px;color:var(--text-primary);}
    .patient-id-code{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;}
    .badge-dot{width:6px;height:6px;border-radius:50%;}
    .badge-high{background:#fff0f0;color:var(--red);}
    .badge-high .badge-dot{background:var(--red);}
    .badge-medium{background:#fff8f0;color:var(--orange);}
    .badge-medium .badge-dot{background:var(--orange);}
    .badge-low{background:#f0faf4;color:var(--green);}
    .badge-low .badge-dot{background:var(--green);}
    .badge-opg{background:var(--teal-light);color:var(--teal-dark);}
    .badge-iopa{background:#f0f0ff;color:#5040c0;}
    .badge-completed{background:#f0faf4;color:var(--green);}
    .badge-completed .badge-dot{background:var(--green);}
    .badge-pending{background:#fff8f0;color:var(--orange);}
    .badge-pending .badge-dot{background:var(--orange);}
    .badge-processing{background:var(--teal-light);color:var(--teal);}
    .badge-processing .badge-dot{background:var(--teal);}
    .btn-view{background:var(--teal);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;transition:all var(--transition);display:inline-block;}
    .btn-view:hover{background:var(--teal-dark);transform:translateY(-1px);box-shadow:0 3px 10px rgba(13,115,119,0.25);}
    .loading{text-align:center;padding:48px;color:var(--text-muted);}
    .spinner{width:36px;height:36px;border:3px solid var(--teal-light);border-top-color:var(--teal);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
    .pagination{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 18px;border-top:1px solid var(--border);}
    .page-btn{padding:6px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text-secondary);transition:all var(--transition);}
    .page-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal);background:var(--teal-light);}
    .page-btn:disabled{opacity:0.4;cursor:not-allowed;}
    .page-info{font-size:12.5px;color:var(--text-muted);}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
  {% csrf_token %}

  {% include 'partials/_sidebar.html' with active_page='history' %}

  <main class="main">
    <div class="page-header">
      <div>
        <h2>Patient History</h2>
        <p>All scans and detection records</p>
      </div>
      <a href="/upload/" style="background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;transition:all var(--transition)">
        <span class="material-icons-round">add</span> New Scan
      </a>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="search-wrap">
        <span class="material-icons-round">search</span>
        <input type="text" id="search-input" placeholder="Search by patient name or ID..." oninput="applyFilters()" />
      </div>
      <select class="filter-select" id="filter-type" onchange="applyFilters()">
        <option value="">All Types</option>
        <option value="OPG">OPG</option>
        <option value="IOPA">IOPA</option>
      </select>
      <select class="filter-select" id="filter-status" onchange="applyFilters()">
        <option value="">All Statuses</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
      </select>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div id="scans-loading" class="loading">
        <div class="spinner"></div>
        <div>Loading patient history...</div>
      </div>
      <table id="scans-table" style="display:none">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Scan Type</th>
            <th>Findings</th>
            <th>Severity</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="scans-body"></tbody>
      </table>
      <div class="pagination" id="pagination" style="display:none">
        <button class="page-btn" id="btn-prev" onclick="changePage(-1)" disabled>← Prev</button>
        <span class="page-info" id="page-info"></span>
        <button class="page-btn" id="btn-next" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </main>

  <script>
    const API = '/api';
    let allScans = [];
    let currentPage = 1;
    const PAGE_SIZE = 15;

    function getInitials(name) { return (name||'?').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2); }

    function severityBadge(sev) {
      const map={high:'badge-high',medium:'badge-medium',low:'badge-low'};
      const lbl={high:'High Risk',medium:'Moderate',low:'Low Risk'};
      return `<span class="badge ${map[sev]||'badge-low'}"><span class="badge-dot"></span>${lbl[sev]||'Low'}</span>`;
    }

    function scanTypeBadge(type) {
      return `<span class="badge ${type==='OPG'?'badge-opg':'badge-iopa'}">${type}</span>`;
    }

    function statusBadge(s) {
      const map={completed:'badge-completed',pending:'badge-pending',processing:'badge-processing'};
      return `<span class="badge ${map[s]||'badge-pending'}"><span class="badge-dot"></span>${s}</span>`;
    }

    async function loadHistory() {
      try {
        const res  = await fetch(`${API}/scans/`);
        const data = await res.json();
        allScans   = Array.isArray(data) ? data : (data.results || []);
        renderTable();
        document.getElementById('scans-loading').style.display = 'none';
        document.getElementById('scans-table').style.display   = 'table';
      } catch (err) {
        document.getElementById('scans-loading').innerHTML =
          `<div style="color:var(--red)">❌ Could not load history. Is the Django server running?</div>`;
      }
    }

    function applyFilters() {
      currentPage = 1;
      renderTable();
    }

    function changePage(dir) {
      const total = getFiltered().length;
      const pages = Math.ceil(total / PAGE_SIZE);
      currentPage = Math.max(1, Math.min(pages, currentPage + dir));
      renderTable();
    }

    function getFiltered() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const type   = document.getElementById('filter-type').value;
      const status = document.getElementById('filter-status').value;
      return allScans.filter(s => {
        const matchSearch = !search || s.patient_name?.toLowerCase().includes(search) || s.patient_id_code?.toLowerCase().includes(search);
        const matchType   = !type   || s.scan_type === type;
        const matchStatus = !status || s.status === status;
        return matchSearch && matchType && matchStatus;
      });
    }

    function renderTable() {
      const filtered = getFiltered();
      const pages    = Math.ceil(filtered.length / PAGE_SIZE);
      const start    = (currentPage-1)*PAGE_SIZE;
      const page     = filtered.slice(start, start+PAGE_SIZE);

      const tbody = document.getElementById('scans-body');
      if (page.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">No records found. <a href="/upload/" style="color:var(--teal);font-weight:600">Upload a scan →</a></td></tr>`;
      } else {
        tbody.innerHTML = page.map(scan => `
          <tr>
            <td>
              <div class="patient-cell">
                <div class="patient-initials">${getInitials(scan.patient_name)}</div>
                <div>
                  <div class="patient-full-name">${scan.patient_name}</div>
                  <div class="patient-id-code">${scan.patient_id_code}</div>
                </div>
              </div>
            </td>
            <td>${scanTypeBadge(scan.scan_type)}</td>
            <td><span style="font-weight:600">${scan.disease_count}</span> <span style="color:var(--text-muted);font-size:12px">finding${scan.disease_count!==1?'s':''}</span></td>
            <td>${severityBadge(scan.highest_severity)}</td>
            <td>${statusBadge(scan.status)}</td>
            <td style="color:var(--text-secondary)">${new Date(scan.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td>
            <td style="display:flex;gap:8px">
              <a href="/results/?scan=${scan.id}" class="btn-view">Results</a>
              <a href="/reports/?scan=${scan.id}" class="btn-view" style="background:none;color:var(--teal);border:1.5px solid var(--teal)">Report</a>
            </td>
          </tr>
        `).join('');
      }

      const paginationEl = document.getElementById('pagination');
      if (pages > 1) {
        paginationEl.style.display = 'flex';
        document.getElementById('page-info').textContent = `Page ${currentPage} of ${pages} — ${filtered.length} records`;
        document.getElementById('btn-prev').disabled = currentPage === 1;
        document.getElementById('btn-next').disabled = currentPage === pages;
      } else {
        paginationEl.style.display = 'none';
      }
    }

    loadHistory();
  </script>
</body>
</html>
