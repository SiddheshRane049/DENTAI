<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DentAI — 2-Step Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      background: #0a0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated gradient background */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,105,92,0.35) 0%, transparent 70%),
                  radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,150,136,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse 50% 50% at 20% 70%, rgba(0,77,64,0.2) 0%, transparent 60%);
      animation: pulse-bg 8s ease-in-out infinite alternate;
    }
    @keyframes pulse-bg {
      0%   { opacity: 0.8; }
      100% { opacity: 1; }
    }

    .card {
      background: rgba(15, 22, 36, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 150, 136, 0.2);
      box-shadow: 0 0 60px rgba(0, 105, 92, 0.15), 0 25px 50px rgba(0,0,0,0.5);
      border-radius: 24px;
    }

    .otp-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 12px;
      width: 48px;
      height: 56px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      transition: all 0.2s;
      outline: none;
    }
    .otp-input:focus {
      border-color: rgba(0, 150, 136, 0.6);
      background: rgba(0, 150, 136, 0.07);
      box-shadow: 0 0 0 3px rgba(0, 150, 136, 0.15);
    }

    .btn-verify {
      background: linear-gradient(135deg, #00695c 0%, #00897b 50%, #26a69a 100%);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0, 105, 92, 0.4);
    }
    .btn-verify:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(0, 105, 92, 0.5);
    }

    .error-box {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid rgba(220, 53, 69, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      color: #ff6b6b;
      font-size: 13.5px;
    }

    .logo-ring {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #00695c, #26a69a);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(0, 105, 92, 0.4);
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>
  <!-- Animated background -->
  <div class="bg-glow"></div>

  <!-- Verification Card -->
  <div class="card relative z-10 w-full max-w-md mx-4 p-8 md:p-10">

    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="logo-ring">🔒</div>
      <h1 class="text-2xl font-bold text-white mb-1">2-Step Verification</h1>
      <p class="text-xs text-gray-400">Security Checkpoint</p>
    </div>

    <!-- Instructions -->
    <div class="text-center mb-6">
      <p class="text-sm text-gray-300">
        We've sent a 6-digit verification code to:<br/>
        <strong class="text-teal-400">{{ email }}</strong>
      </p>
      <p class="text-xs text-gray-500 mt-2">Enter the code below to sign in.</p>
    </div>

    <!-- Error message -->
    {% if error %}
    <div class="error-box mb-5 flex items-center gap-2">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- OTP Form -->
    <form method="post" id="otp-form" class="space-y-6">
      {% csrf_token %}
      
      <!-- Combined OTP input -->
      <input type="hidden" name="otp" id="id_otp" />

      <!-- Display Boxes -->
      <div class="flex justify-between gap-2 max-w-xs mx-auto" id="otp-boxes">
        <input type="text" maxlength="1" class="otp-input" required autofocus />
        <input type="text" maxlength="1" class="otp-input" required />
        <input type="text" maxlength="1" class="otp-input" required />
        <input type="text" maxlength="1" class="otp-input" required />
        <input type="text" maxlength="1" class="otp-input" required />
        <input type="text" maxlength="1" class="otp-input" required />
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-verify">
        Verify & Sign In
      </button>
    </form>

    <!-- Resend Code -->
    <div class="mt-6 text-center">
      <p class="text-xs text-gray-500">
        Didn't receive the code? 
        <span id="timer-container" class="text-gray-400 font-medium">Resend in <span id="timer">60</span>s</span>
        <a href="?resend=1" id="resend-btn" class="hidden text-teal-400 hover:text-teal-300 font-semibold transition-colors">Resend Code</a>
      </p>
    </div>
  </div>

  <script>
    const inputs = document.querySelectorAll('#otp-boxes input');
    const otpInput = document.getElementById('id_otp');
    const form = document.getElementById('otp-form');

    // Handle auto-focus and navigation between OTP boxes
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        updateOtpValue();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
      
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = e.clipboardData.getData('text').trim();
        if (/^\d{6}$/.test(pasteData)) {
          inputs.forEach((inp, idx) => {
            inp.value = pasteData[idx];
          });
          updateOtpValue();
          inputs[5].focus();
        }
      });
    });

    function updateOtpValue() {
      let code = '';
      inputs.forEach(input => {
        code += input.value;
      });
      otpInput.value = code;
    }

    form.addEventListener('submit', (e) => {
      updateOtpValue();
      if (otpInput.value.length !== 6) {
        e.preventDefault();
        alert('Please enter all 6 digits.');
      } else {
        const btn = e.target.querySelector('button[type=submit]');
        btn.textContent = 'Verifying…';
        btn.style.opacity = '0.8';
      }
    });

    // Simple countdown timer for resending OTP
    let secondsLeft = 60;
    const timerSpan = document.getElementById('timer');
    const timerContainer = document.getElementById('timer-container');
    const resendBtn = document.getElementById('resend-btn');

    const countdown = setInterval(() => {
      secondsLeft--;
      timerSpan.textContent = secondsLeft;
      if (secondsLeft <= 0) {
        clearInterval(countdown);
        timerContainer.classList.add('hidden');
        resendBtn.classList.remove('hidden');
      }
    }, 1000);
  </script>
</body>
</html>
