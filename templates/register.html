{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DentAI — Doctor Registration</title>
  <link rel="icon" type="image/png" href="{% static 'logo.png' %}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      background: #0a0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 40px 0;
    }

    /* Animated gradient background */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,105,92,0.35) 0%, transparent 70%),
                  radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,150,136,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse 50% 50% at 20% 70%, rgba(0,77,64,0.2) 0%, transparent 60%);
      animation: pulse-bg 8s ease-in-out infinite alternate;
    }
    @keyframes pulse-bg {
      0%   { opacity: 0.8; }
      100% { opacity: 1; }
    }

    .card {
      background: rgba(15, 22, 36, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 150, 136, 0.2);
      box-shadow: 0 0 60px rgba(0, 105, 92, 0.15), 0 25px 50px rgba(0,0,0,0.5);
      border-radius: 24px;
    }

    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px 12px 46px;
      width: 100%;
      font-size: 15px;
      transition: all 0.2s;
      outline: none;
    }
    .input-field:focus {
      border-color: rgba(0, 150, 136, 0.6);
      background: rgba(0, 150, 136, 0.07);
      box-shadow: 0 0 0 3px rgba(0, 150, 136, 0.15);
    }
    .input-field::placeholder { color: rgba(255,255,255,0.35); }

    .btn-register {
      background: linear-gradient(135deg, #00695c 0%, #00897b 50%, #26a69a 100%);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0, 105, 92, 0.4);
      position: relative;
      overflow: hidden;
    }
    .btn-register::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }
    .btn-register:hover::before { left: 100%; }
    .btn-register:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(0, 105, 92, 0.5);
    }
    .btn-register:active { transform: translateY(0); }

    .error-box {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid rgba(220, 53, 69, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      color: #ff6b6b;
      font-size: 13.5px;
    }

    .logo-ring {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #00695c, #26a69a);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(0, 105, 92, 0.4);
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>
  <!-- Animated background -->
  <div class="bg-glow"></div>

  <!-- Registration Card -->
  <div class="card relative z-10 w-full max-w-lg mx-4 p-8 md:p-10">

    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="logo-ring">🦷</div>
      <h1 class="text-2xl font-bold text-white mb-1">DentAI Portal</h1>
      <p class="text-xs text-gray-400">Doctor Account Registration</p>
    </div>

    <!-- Error message -->
    {% if error %}
    <div class="error-box mb-5 flex items-center gap-2">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Registration Form -->
    <form method="post" id="register-form">
      {% csrf_token %}

      <!-- Full Name -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <input
            name="full_name"
            type="text"
            class="input-field"
            placeholder="Dr. Siddhesh Rane"
            value="{{ data.full_name }}"
            required
            autofocus
          />
        </div>
      </div>

      <!-- Username -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <input
            name="username"
            type="text"
            class="input-field"
            placeholder="siddhesh_rane"
            value="{{ data.username }}"
            required
          />
        </div>
      </div>

      <!-- Email Address -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <input
            name="email"
            type="email"
            class="input-field"
            placeholder="siddhesh@gmail.com"
            value="{{ data.email }}"
            required
          />
        </div>
      </div>

      <!-- Designation -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Designation</label>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <input
            name="designation"
            type="text"
            class="input-field"
            placeholder="Dental Surgeon, Orthodontist, etc."
            value="{{ data.designation }}"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input
              name="password"
              type="password"
              class="input-field"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Confirm Password</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            <input
              name="confirm_password"
              type="password"
              class="input-field"
              placeholder="••••••••"
              required
            />
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-register mb-4">
        Create Doctor Account
      </button>

      <!-- Back to Login -->
      <p class="text-center text-sm text-gray-400">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-teal-400 hover:text-teal-300 font-semibold transition-colors">Sign In</a>
      </p>
    </form>
  </div>

  <script>
    // Subtle form submit animation
    document.getElementById('register-form').addEventListener('submit', (e) => {
      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Creating account…';
      btn.style.opacity = '0.8';
    });
  </script>
</body>
</html>
